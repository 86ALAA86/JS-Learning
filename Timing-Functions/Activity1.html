<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Test page</h1>
    <button onclick="StartCountDown()">Count</button>
    <h1 id="CD">Click to start</h1>

    <script>
      function StartCountDown() {
        let CD = document.getElementById("CD");

        CD.textContent = "Starting..";

        setTimeout(() => {
          let count = 0;
          CD.textContent = "Running..";
          let IntervalId = setInterval(() => {
            count++;
            CD.textContent = "Running.." + count;

            if (count === 5) {
              clearInterval(IntervalId);
              setTimeout(() => {
                alert("Time is UP");
              }, 500);
            }
          }, 1000);
        }, 2000);
      }
    </script>
  </body>
</html>
