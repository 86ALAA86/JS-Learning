<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 style="font-size: 3rem; margin-left: 2rem">Prompt testing .</h1>
  </body>

  <script>
    let name = prompt("What is your name ?");
    if (name === null) {
      alert("You did Cancel the input");
    } else if (name === "") {
      alert("You did not input anything");
    } else {
      alert(`Hello , ${name} !`);
    }
  </script>
</html>
