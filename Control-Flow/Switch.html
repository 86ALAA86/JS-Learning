<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 style="color: red; font-size: 3rem; margin: 30px">
      Open The Console to see the executed JS results
    </h1>

    <script>
      {
        console.log(`\nExample 1 :\n\n\n`);

        let day = 6;

        switch (day) {
          case 1:
            console.log("Monday");
            break;
          case 2:
            console.log("Tuseday");
            break;
          case 3:
            console.log("Wednesday");
            break;
          case 4:
            console.log("Thursday");
            break;
          case 5:
            console.log("Friday");
            break;
          case 6:
            console.log("Saturday");
            break;
          case 7:
            console.log("Sunday");
            break;
          default:
            console.log("not a valid day");
        }
      }

      {
        console.log(`\nExample 2 :\n\n\n`);

        let role = "admin";

        switch (role) {
          case "admin":
            console.log("admin access");
            break;
          case "editor":
            console.log("editor access");
            break;
          case "viewer":
            console.log("viewer access");
            break;

          default:
            console.log("No Access");
        }
      }

      {
        console.log(`\nExample 3 :\n\n\n`);

        let Light = "red";

        switch (Light) {
          case "red":
            console.log("stop");
            break;
          case "yellow":
            console.log("get ready");
            break;
          case "green":
            console.log("go");
            break;
          default:
            console.log("Invalid signal");
        }
      }

      {
        console.log(`\nExample 4 :\n\n\n`);

        let month = "Sep";

        switch (month) {
          case "Dec":
          case "Jan":
          case "Feb":
            console.log("Winter");
          case "Mar":
          case "Apr":
          case "May":
            console.log("Spring");
          case "Jun":
          case "Jul":
          case "Aug":
            console.log("Summer");
          case "Sep":
          case "Oct":
          case "Nov":
            console.log("Fall");

          default:
            console.log("not a valid day");
        }
      }

      {
        console.log(`\nExample 5 :\n\n\n`);

        let country = "USA";

        switch (country) {
          case "USA":
            console.log("5$");
            break;
          case "Canada":
            console.log("10$");
            break;
          case "UK":
            console.log("15$");
            break;
          default:
            console.log("20$");
        }
      }
    </script>
  </body>
</html>
