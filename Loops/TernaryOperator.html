<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 style="color: red; font-size: 3rem; margin: 30px">
      Open The Console to see the executed JS results
    </h1>
    <script>
      {
        console.log(`\n\n\nExample 1 : \n`);
        console.log(3 > 0 ? "positive" : "Negative");
      }

      {
        console.log(`\n\n\nExample 2 : \n`);
        let LoggedIn = true;
        console.log(LoggedIn ? "Welcome Back" : "Please Login");
      }

      {
        console.log(`\n\n\nExample 3 : \n`);
        let Score = 70;
        console.log(Score >= 50 ? "Passed" : "Failed");
      }

      {
        console.log(`\n\n\nExample 4 : \n`);
        let name = "Ali";
        console.log(name.length > 5 ? "Long Name " : "Short Name");
      }

      {
        console.log(`\n\n\nExample 5 : \n`);
        let Age = 60;
        console.log(Age > 20 ? "Adult" : Age > 13 ? "Teenager" : "Child");
      }
    </script>
  </body>
</html>
