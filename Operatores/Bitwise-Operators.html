<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 style="color: red; font-size: 3rem; margin: 30px">
      Open The Console to see the executed JS results
    </h1>
    <script>
      const READ = 1; // 0001
      const WRITE = 2; // 0010
      const EXECUTE = 4; // 0100

      let user = READ | WRITE;

      console.log(user & READ); // true-like
      console.log(user & EXECUTE); // 0 (false-like)

      user ^= EXECUTE; // toggle EXECUTE
      console.log(user); // now includes EXECUTE
    </script>
  </body>
</html>
